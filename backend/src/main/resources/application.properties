spring.application.name=attendance-management
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/attendance_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=ChangeThisDevelopmentSecretKeyToAtLeast32CharactersLong123456
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:5173
